name: UTP staging
on:
  push:
    branches: ['feat/**', 'chore/**']
jobs:
  verify:
    name: verify
    runs-on: node-20
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - run: npm run ci:fast
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
